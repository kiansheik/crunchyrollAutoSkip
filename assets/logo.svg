<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Crunchyroll Auto Skipper logo</title>
  <desc id="desc">A fast-forward skip mark inside a warm circular progress ring.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="72" x2="432" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#0b101c"/>
    </linearGradient>
    <linearGradient id="ring" x1="120" y1="92" x2="394" y2="421" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="0.54" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ff4d35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="#253149" stroke-width="44"/>
  <path
    d="M256 98a158 158 0 1 1-136.83 79"
    fill="none"
    stroke="url(#ring)"
    stroke-linecap="round"
    stroke-width="44"
  />
  <path
    d="M172 170v172l121-86-121-86Zm118 0v172l121-86-121-86Z"
    fill="#ffffff"
    filter="url(#shadow)"
  />
  <rect x="392" y="170" width="28" height="172" rx="14" fill="#ffffff"/>
  <circle cx="128" cy="177" r="18" fill="#67e8f9"/>
</svg>
